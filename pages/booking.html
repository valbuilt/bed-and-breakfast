<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/booking-chengcheng/css/style.css">
  <title>Room detail-booking page</title>
</head>
<body>
  <nav>
    <a href="/" class="logo">StayWell</a>
    <ul class="nav-menu">
      <li><a>Favorites</a></li>
      <li><a href="/pages/trips.html">Trips</a></li>
      <li><a href="/pages/signup.html">Login</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <img src="/icons/menu.svg" alt="">
    </button>
  </nav>
  
  <main>
    <section id="gallery"></section>
    
    <div class="wrapper">
      <div class="layout">
        <div class="left-content">
          <section id= "room-info"></section>
          <section id="description"></section>
          <section id="amenities"></section>
        </div>
        <section id="booking-form"></section>
      </div>

      <section id="reviews"></section>

      <section id="map"></section>
        
    </div>

    <div class="mobil-book hidden">
      <h2>1 200 kr / night</h2>
      <button id="open-form" class="btn">Book</button>
    </div>
     
    <dialog id="dialog-window" class="dialog-window">
      <button id="dialog-close" class="dialog-close">x</button>
      <div class="dialog-content">
        <h2>🎉 Booking Confirmed!</h2>
        <p>Your stay is book💖  09/05/2026 - 14/05/2026</p>
        <p>We can't wait to host you -- see you soon!✨</p>
    </dialog>
    </div>

  </main>

  <script type="module" src="/src/booking-chengcheng/ts/pages.ts/booking.ts"></script>
  
</body>
</html>
