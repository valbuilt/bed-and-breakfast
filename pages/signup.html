<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/signup-anders/styles.css" />
    <link rel="stylesheet" href="/src/booking-chengcheng/css/style.css" />
    <script
      src="https://kit.fontawesome.com/ee1d2b81ed.js"
      crossorigin="anonymous"
    ></script>
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <nav>
        <a href="/" class="logo">StayWell</a>
        <ul class="nav-menu">
          <li><a href="/pages/trips.html">Trips</a></li>
          <li><a href="/pages/favourites.html">Favourites</a></li>
          <li><a href="/pages/signup.html">Login</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <img src="/icons/menu.svg" alt="Menu icon" />
        </button>
      </nav>

      <div class="signup-container">
        <div class="form-container">
          <h1 id="title">Sign Up</h1>
          <form>
            <div class="input-group">
              <div class="input-field" id="nameField">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Name" id="userName" />
              </div>

              <div class="input-field">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="Email" id="userEmail" />
              </div>

              <div class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  placeholder="Password"
                  id="userPassword"
                />
              </div>
              <p>Forgot Password? <a href="#">Click here!</a></p>
            </div>
            <div class="btn-field">
              <button type="button" id="signupBtn">Sign Up</button>
              <button type="button" id="signinBtn" class="disable">
                Sign In
              </button>
            </div>
          </form>
          <!-- Chengcheng added 2 buttons to distinguish UI switching and logic function -->
          <br />
          <div>
            <button id="signupSubmit" class="btn">Create Account</button>
            <button id="signinSubmit" class="btn">Login</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/signup-anders/main.ts"></script>
  </body>
</html>
