<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/homepage-valerie/css/style.css" />
    <link rel="stylesheet" href="/src/booking-chengcheng/css/style.css" />
    <title>Search Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <nav>
      <a href="/" class="logo">StayWell</a>
      <ul class="nav-menu">
        <li><a href="/pages/trips.html">Trips</a></li>
        <li><a href="/pages/favourites.html">Favourites</a></li>
        <li><a href="/pages/signup.html">Login</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <img src="/icons/menu.svg" alt="" />
      </button>
    </nav>

    <div class="searchOverview">
      <div class="searchDetails">
        <div class="searchDetailsLocation"></div>
      </div>
    </div>

    <main>
      <div class="resultsLayout">
        <div class="resultsLeft">
          <h1></h1>
          <p></p>
          <div id="results-container"></div>
        </div>

        <div class="resultsRight">
          <div class="filterPanel">
            <h2>Adjust your search</h2>
            <div class="filterItem">
              <label for="filter-arrival">Arrival</label>
              <input type="date" id="filter-arrival" />
            </div>
            <div class="filterItem">
              <label for="filter-departure">Departure</label>
              <input type="date" id="filter-departure" />
            </div>
            <div class="filterItem">
              <label for="filter-guests">Guests</label>
              <input type="number" id="filter-guests" min="1" />
            </div>

            <div class="filterItem">
              <label for="filter-price">Max price per night</label>
              <input
                type="range"
                id="filter-price"
                min="0"
                max="5000"
                value="5000"
                list="price-markers"
              />
              <datalist id="price-markers">
                <option value="0"></option>
                <option value="1000"></option>
                <option value="2000"></option>
                <option value="3000"></option>
                <option value="4000"></option>
                <option value="5000"></option>
              </datalist>
              <p id="price-display">5000 kr</p>
            </div>

            <button id="filter-button">Apply</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footerContainer">
        <p class="copyright">&copy; 2026 StayWell. All rights reserved.</p>

        <div class="socialWrapper">
          <h3>Follow us on</h3>
          <div class="socialIcons">
            <img
              src="/icons/instagram.svg"
              alt="Instagram"
              class="footerIcon"
            />
            <img src="/icons/facebook.svg" alt="Facebook" class="footerIcon" />
          </div>
        </div>
      </div>
    </footer>

    <script
      type="module"
      src="/src/homepage-valerie/ts/searchResults.ts"
    ></script>
  </body>
</html>
